name: Deploy

# 推送即部署：main 上有代码/配置变更时，SSH 到 VPS pull + 重建容器。
# 需要仓库 Secrets：VPS_HOST / VPS_USER / VPS_SSH_KEY（见 docs/VPS.md）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "docker-compose.yml"

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          # The default is 10m, and `docker compose up -d --build` has to run
          # `npm ci` inside the image on the VPS behind a local proxy. That step
          # alone has taken ~9 minutes there, so the whole deploy sits right on
          # the default limit and times out non-deterministically.
          #
          # Measured 2026-09-13: the deploy for PR #23 hit
          # `2026/09/13 07:55:18 Run Command Timeout` during
          # `#8 RUN npm ci --omit=dev`, i.e. the fix was merged to main and
          # never reached the VPS. A timeout here is indistinguishable, from the
          # outside, from a healthy deploy that simply did not happen — which is
          # the worst possible failure mode for a deploy that is the ONLY thing
          # standing between a merged fix and production.
          command_timeout: 30m
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/deviantdrop
            export HTTP_PROXY=http://127.0.0.1:7890 HTTPS_PROXY=http://127.0.0.1:7890
            git pull --ff-only origin main
            # The commit that dispatched this run must be an ancestor of what
            # the VPS checked out, not byte-equal: a second PR merged between
            # dispatch and the pull fast-forwards origin/main past github.sha,
            # and an equality check then aborts BEFORE the image is rebuilt —
            # leaving production on the old image with a pull that looked
            # healthy. FF-only above already guarantees no backwards move.
            git merge-base --is-ancestor "${{ github.sha }}" HEAD
            docker compose up -d --build
            # /health deliberately always answers HTTP 200 while degraded, so a
            # restart loop cannot be amplified by Docker's healthcheck. That
            # makes `curl -f` useless as a deploy gate: on 2026-09-13 the PR #28
            # deploy "succeeded" while the response was
            #   {"ok":false,...,"degraded":["telegram_ingress"],...}
            # read 2s after start, before the first getUpdates long-poll
            # (timeout=25s) could flip telegram_ingress from `starting` to
            # `polling`. Gate on the parsed JSON `ok` field instead, and wait
            # long enough for that first poll to land.
            for attempt in $(seq 1 30); do
              body=$(curl -fsS --max-time 10 http://127.0.0.1:8080/health || true)
              echo "$body"
              case "$body" in
                '{"ok":true'*)
                  echo "deploy gate: /health ok after ${attempt} attempt(s)"
                  exit 0
                  ;;
              esac
              sleep 3
            done
            echo "deploy gate: /health never reported ok" >&2
            exit 1
