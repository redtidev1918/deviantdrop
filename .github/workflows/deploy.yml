name: Deploy

# 推送即部署：main 上有代码/配置变更时，SSH 到 VPS pull + 重建容器。
# 需要仓库 Secrets：VPS_HOST / VPS_USER / VPS_SSH_KEY（见 docs/VPS.md）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "docker-compose.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/deviantdrop
            git pull -q origin main
            export HTTP_PROXY=http://127.0.0.1:7890 HTTPS_PROXY=http://127.0.0.1:7890
            docker compose up -d --build
