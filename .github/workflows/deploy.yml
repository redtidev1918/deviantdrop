name: Deploy

# 推送即部署：main 上有代码/配置变更时，SSH 到 VPS pull + 重建容器。
# 需要仓库 Secrets：VPS_HOST / VPS_USER / VPS_SSH_KEY（见 docs/VPS.md）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "docker-compose.yml"

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/deviantdrop
            export HTTP_PROXY=http://127.0.0.1:7890 HTTPS_PROXY=http://127.0.0.1:7890
            git pull --ff-only origin main
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            docker compose up -d --build
            for attempt in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
              sleep 2
            done
            exit 1
